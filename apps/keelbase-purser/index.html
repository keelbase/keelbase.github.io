<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../keelbase-shared/styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Purser</h1>
      <p class="meta">Testnet simulation for vendor payments until Slash is live.</p>
      <form id="payForm" class="form-grid" style="margin-top:0.75rem;">
        <label>
          Vessel
          <select id="vesselSelect"></select>
        </label>
        <label>
          Vendor
          <input id="vendorInput" placeholder="Acme Vendor" />
        </label>
        <label>
          Amount
          <input id="amountInput" placeholder="500" />
        </label>
        <label>
          Currency
          <input id="currencyInput" value="USD" />
        </label>
        <label>
          Description
          <textarea id="descriptionInput" placeholder="Monthly tooling invoice"></textarea>
        </label>
        <button id="submitBtn" type="submit">Simulate Payment</button>
      </form>
      <p id="status" class="meta" style="margin-top:0.6rem;"></p>
      <section id="paymentsList" class="list" style="margin-top:0.6rem;"></section>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
