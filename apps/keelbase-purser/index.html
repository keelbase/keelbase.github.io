<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../keelbase-shared/styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Purser</h1>
      <p class="meta">Vendor payments from the vessel treasury. Native NEAR transfers on testnet.</p>

      <section id="treasuryPanel" class="form-grid" style="margin:0.6rem 0; gap:0.4rem;">
        <label>
          Vessel
          <select id="vesselSelect"></select>
        </label>
        <div class="meta">
          <div>Treasury balance: <strong id="treasuryBalance">loading...</strong> NEAR</div>
          <div>USDC balance: <strong id="treasuryBalanceUsdc">-</strong> USDC</div>
          <div>Fund this address to add balance: <code id="depositAddress">-</code></div>
          <div>Auto-approve threshold: <span id="autoApproveNear">-</span> NEAR</div>
          <div id="treasuryNote" class="status-warn" style="margin-top:0.3rem; font-size:0.85em;"></div>
        </div>
      </section>

      <form id="payForm" class="form-grid" style="margin-top:0.75rem;">
        <label>
          Vendor account (NEAR account id)
          <input id="vendorInput" placeholder="alice.testnet" />
        </label>
        <label>
          Amount
          <input id="amountInput" placeholder="1.5" />
        </label>
        <label>
          Currency
          <input id="currencyInput" value="NEAR" readonly />
        </label>
        <label>
          Description
          <textarea id="descriptionInput" placeholder="Monthly tooling invoice"></textarea>
        </label>
        <button id="submitBtn" type="submit">Send Payment</button>
      </form>
      <p id="status" class="meta" style="margin-top:0.6rem;"></p>
      <section id="paymentsList" class="list" style="margin-top:0.6rem;"></section>

      <details style="margin-top: 1rem;">
        <summary class="meta" style="cursor:pointer;">Security Controls</summary>
        <div class="form-grid" style="margin-top:0.5rem; gap:0.4rem;">
          <label>
            Approve counterparty
            <input id="approveAccountInput" placeholder="alice.testnet" />
          </label>
          <button id="approveBtn" type="button">Approve</button>
          <p id="approveStatus" class="meta" style="min-height:1.2em;"></p>
          <button id="resetVelocityBtn" type="button" style="margin-top:0.5rem;">Reset Velocity Circuit</button>
          <p id="velocityStatus" class="meta" style="min-height:1.2em;"></p>
        </div>
      </details>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
